spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate creates/updates schema automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# PostgreSQL triggers/procedures installed by DatabaseRoutineInitializer after startup

# JWT configuration
app.jwt.secret=MY/CpAZa8Lnk4cDC9V9UZPRTc/2GgZk27ulU5D1I0EE=
app.jwt.expiration-ms=86400000

# Gmail SMTP (use App Password, not normal Gmail password)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=corenegasore@gmail.com
spring.mail.password=zgeyumbcutrapvqt
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# From address must match the authenticated Gmail account
app.mail.from=corenegasore@gmail.com
app.mail.enabled=true
# Disable actuator mail health check (avoids TLS warning on startup; EmailService still sends mail)
management.health.mail.enabled=false

# Registration OTP
app.otp.length=6
app.otp.expiry-minutes=10

# Late-payment penalty (automatic cron + POST /api/bills/{id}/apply-penalty)
app.billing.penalty-days-overdue=30
# Spring 6-field cron: second minute hour day month weekday (default: daily at 02:00)
app.scheduler.cron.penalties=0 0 2 * * *

# Swagger — expose all REST controllers under /api
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
springdoc.packages-to-scan=com.ne.wasac.controller
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.show-actuator=false
